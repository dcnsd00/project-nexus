name: NEXUS CI

on:
  push:
    branches: [main, "feature/**", "integration/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-detection:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
      root: ${{ steps.detect.outputs.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect application source
        id: detect
        shell: bash
        run: |
          if [ -f application/nexus_master.py ] && [ -d application/tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=application" >> "$GITHUB_OUTPUT"
            echo "NEXUS application source found in application/."
          elif [ -f nexus_master.py ] && [ -d tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=." >> "$GITHUB_OUTPUT"
            echo "NEXUS application source found in repository root."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "root=" >> "$GITHUB_OUTPUT"
            echo "::notice::Application source has not been imported yet. Python test job will be skipped; documentation commits are not treated as application test failures."
          fi

  python-tests:
    needs: source-detection
    if: needs.source-detection.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for dashboard validation
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          python -m pip install --upgrade pip
          if [ -f "$ROOT/requirements-dev.txt" ]; then
            python -m pip install -r "$ROOT/requirements-dev.txt"
          elif [ -f "$ROOT/requirements.txt" ]; then
            python -m pip install -r "$ROOT/requirements.txt"
            python -m pip install pytest
          else
            echo "::error::No requirements file found in source root: $ROOT"
            exit 1
          fi
          if [ -f "$ROOT/requirements-edge.txt" ]; then
            python -m pip install -r "$ROOT/requirements-edge.txt"
          fi
      - name: Compile Python sources
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          python -m compileall -q "$ROOT"
      - name: Validate dashboard and wallet JavaScript
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          python "$ROOT/tools_check_dashboard_js.py" "$ROOT"
      - name: Run primary application test suite
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          cd "$ROOT"
          python -m pytest -vv --full-trace --disable-warnings --maxfail=1
      - name: Run adapter, wallet and independent SHA-2 suites
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ needs.source-detection.outputs.root }}"
          ROOT="$(cd "$ROOT" && pwd)"
          MM="$ROOT/adapters/multiminer_x/MULTIMINER_X_v1.0"
          (cd "$MM" && PYTHONPATH="$ROOT:$MM" python -m pytest -q tests)
          FS="$ROOT/adapters/fieldstation/crypto_fieldstation"
          (cd "$FS" && PYTHONPATH="$ROOT:$FS" python -m pytest -q tests)
          WALLET="$ROOT/modules/wallet_benchmark"
          (cd "$WALLET" && PYTHONPATH="$ROOT:$WALLET" python -m pytest -q tests)
          (cd "$WALLET/v05" && PYTHONPATH="$ROOT:$WALLET:$WALLET/v05" python -m pytest -q test_v05_unit.py)
          RESEARCH="$ROOT/research/sha2_independent"
          (cd "$RESEARCH" && PYTHONPATH="$ROOT:$RESEARCH" python research_main.py test --out-dir "$RUNNER_TEMP/nexus-sha2-results")

  windows-compatibility:
    needs: source-detection
    if: needs.source-detection.outputs.available == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for dashboard validation
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          python -m pip install --upgrade pip
          if (Test-Path (Join-Path $Root "requirements-dev.txt")) {
            python -m pip install -r (Join-Path $Root "requirements-dev.txt")
          } else {
            python -m pip install -r (Join-Path $Root "requirements.txt")
            python -m pip install pytest
          }
          if (Test-Path (Join-Path $Root "requirements-edge.txt")) {
            python -m pip install -r (Join-Path $Root "requirements-edge.txt")
          }
      - name: Configure MSVC x64 build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile Python sources
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          python -m compileall -q $Root
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed." }
      - name: Validate dashboard and wallet JavaScript
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          python (Join-Path $Root "tools_check_dashboard_js.py") $Root
          if ($LASTEXITCODE -ne 0) { throw "Dashboard JavaScript validation failed." }
      - name: Run primary application test suite on Windows
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $Compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Host "Native C compiler: $($Compiler.Source)"
          $env:NEXUS_NATIVE_COMPILER = "msvc"
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings tests/test_mining_solo_matrix_0105.py::test_major_coin_catalog_contains_pow_and_non_pow_classification
            if ($LASTEXITCODE -ne 0) { throw "Isolated Windows mining catalog API test failed." }
            python -m pytest -vv --full-trace --disable-warnings --maxfail=1
            if ($LASTEXITCODE -ne 0) { throw "NEXUS Windows test suite failed." }
          } finally {
            Pop-Location
          }
