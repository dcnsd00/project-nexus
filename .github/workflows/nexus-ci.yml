name: NEXUS CI

on:
  push:
    branches: [main, "feature/**", "integration/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-detection:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
      root: ${{ steps.detect.outputs.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect application source
        id: detect
        shell: bash
        run: |
          if [ -f application/nexus_master.py ] && [ -d application/tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=application" >> "$GITHUB_OUTPUT"
            echo "NEXUS application source found in application/."
          elif [ -f nexus_master.py ] && [ -d tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=." >> "$GITHUB_OUTPUT"
            echo "NEXUS application source found in repository root."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "root=" >> "$GITHUB_OUTPUT"
            echo "::notice::Application source has not been imported yet. Python test job will be skipped; documentation commits are not treated as application test failures."
          fi

  python-tests:
    needs: source-detection
    if: needs.source-detection.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for dashboard validation
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          python -m pip install --upgrade pip
          if [ -f "$ROOT/requirements-dev.txt" ]; then
            python -m pip install -r "$ROOT/requirements-dev.txt"
          elif [ -f "$ROOT/requirements.txt" ]; then
            python -m pip install -r "$ROOT/requirements.txt"
            python -m pip install pytest
          else
            echo "::error::No requirements file found in source root: $ROOT"
            exit 1
          fi
          if [ -f "$ROOT/requirements-edge.txt" ]; then
            python -m pip install -r "$ROOT/requirements-edge.txt"
          fi
      - name: Compile Python sources
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          python -m compileall -q "$ROOT"
      - name: Validate dashboard and wallet JavaScript
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          python "$ROOT/tools_check_dashboard_js.py" "$ROOT"
      - name: Run primary application test suite
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          cd "$ROOT"
          python -m pytest -vv --full-trace --disable-warnings --maxfail=1
      - name: Run adapter, wallet and independent SHA-2 suites
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ needs.source-detection.outputs.root }}"
          ROOT="$(cd "$ROOT" && pwd)"
          MM="$ROOT/adapters/multiminer_x/MULTIMINER_X_v1.0"
          (cd "$MM" && PYTHONPATH="$ROOT:$MM" python -m pytest -q tests)
          FS="$ROOT/adapters/fieldstation/crypto_fieldstation"
          (cd "$FS" && PYTHONPATH="$ROOT:$FS" python -m pytest -q tests)
          WALLET="$ROOT/modules/wallet_benchmark"
          (cd "$WALLET" && PYTHONPATH="$ROOT:$WALLET" python -m pytest -q tests)
          (cd "$WALLET/v05" && PYTHONPATH="$ROOT:$WALLET:$WALLET/v05" python -m pytest -q test_v05_unit.py)
          RESEARCH="$ROOT/research/sha2_independent"
          (cd "$RESEARCH" && PYTHONPATH="$ROOT:$RESEARCH" python research_main.py test --out-dir "$RUNNER_TEMP/nexus-sha2-results")

  windows-compatibility:
    needs: source-detection
    if: needs.source-detection.outputs.available == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for dashboard validation
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          python -m pip install --upgrade pip
          if (Test-Path (Join-Path $Root "requirements-dev.txt")) {
            python -m pip install -r (Join-Path $Root "requirements-dev.txt")
          } else {
            python -m pip install -r (Join-Path $Root "requirements.txt")
            python -m pip install pytest
          }
          if (Test-Path (Join-Path $Root "requirements-edge.txt")) {
            python -m pip install -r (Join-Path $Root "requirements-edge.txt")
          }
      - name: Configure MSVC x64 build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile Python sources
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          python -m compileall -q $Root
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed." }
      - name: Validate dashboard and wallet JavaScript
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          python (Join-Path $Root "tools_check_dashboard_js.py") $Root
          if ($LASTEXITCODE -ne 0) { throw "Dashboard JavaScript validation failed." }
      - name: Run Windows TestClient lifecycle regression modules
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $env:NEXUS_NATIVE_COMPILER = "msvc"
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings tests/test_hybrid_solver_0105.py tests/test_mining_v098.py tests/test_solo_mining_096.py
            if ($LASTEXITCODE -ne 0) { throw "Windows TestClient lifecycle regression modules failed." }
          } finally {
            Pop-Location
          }
      - name: Run isolated Windows API test module
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $Compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Host "Native C compiler: $($Compiler.Source)"
          $env:NEXUS_NATIVE_COMPILER = "msvc"
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings tests/test_mining_solo_matrix_0105.py
            if ($LASTEXITCODE -ne 0) { throw "Isolated Windows mining catalog API module failed." }
          } finally {
            Pop-Location
          }
      - name: Run Windows application test shard 1 of 4
        timeout-minutes: 10
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $env:NEXUS_NATIVE_COMPILER = "msvc"
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings --maxfail=1 tests/rcsc/test_bitcoin_unit.py tests/rcsc/test_rcsc_integration.py tests/rcsc/test_statistics_unit.py tests/test_backend_adapters.py tests/test_bitcoin_pow_engine_0113.py tests/test_blockchain_node_telemetry.py tests/test_blockchain_regtest_import.py tests/test_catalog_cosmos_unmineable_0108.py tests/test_coin_catalog.py tests/test_command_continuity.py tests/test_core_api.py tests/test_crypto_engine.py tests/test_crypto_security.py tests/test_data_paths.py tests/test_desktop_packaging.py tests/test_desktop_shell_021.py tests/test_development_pow.py tests/test_earnings_intelligence.py tests/test_evm_node_telemetry.py tests/test_fieldstation_import_safety.py tests/test_hybrid_orchestrator.py tests/test_hybrid_safety.py tests/test_hybrid_solver_0105.py tests/test_hybrid_supervisor_api.py
            if ($LASTEXITCODE -ne 0) { throw "Windows application test shard 1 of 4 failed." }
          } finally {
            Pop-Location
          }
      - name: Run Windows application test shard 2 of 4
        timeout-minutes: 10
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $env:NEXUS_NATIVE_COMPILER = "msvc"
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings --maxfail=1 tests/test_hybrid_supervisor.py tests/test_hybrid_worker.py tests/test_integration_registry_015.py tests/test_keystore_recovery_20.py tests/test_lifecycle_manager.py tests/test_master.py tests/test_math_intelligence_095.py tests/test_math_intelligence_api_095.py tests/test_mathematical_regression_015.py tests/test_miner_adapters_0109.py tests/test_miner_installer_091.py tests/test_mining_capability_api.py tests/test_mining_capability_registry.py tests/test_mining_catalog_099.py tests/test_mining_compatibility_matrix.py tests/test_mining_controller_090.py tests/test_mining_efficiency_optimizer.py tests/test_mining_optimization_094.py tests/test_mining_process_arbiter.py tests/test_mining_switch_controller.py tests/test_mining_telemetry_evidence.py tests/test_mining_v098.py tests/test_module_registry.py tests/test_native_sha256d_021.py
            if ($LASTEXITCODE -ne 0) { throw "Windows application test shard 2 of 4 failed." }
          } finally {
            Pop-Location
          }
      - name: Report Windows thread diagnostics after shard 2
        if: always()
        shell: pwsh
        run: |
          $DiagnosticPath = Join-Path $env:RUNNER_TEMP "nexus-thread-diagnostics.txt"
          if (Test-Path $DiagnosticPath) {
            Write-Host "Windows thread/process snapshot:"
            Get-Content $DiagnosticPath
          } else {
            Write-Host "No Windows thread diagnostic file was produced."
          }
      - name: Run Windows application test shard 3 of 4
        timeout-minutes: 10
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $env:NEXUS_NATIVE_COMPILER = "msvc"
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings --maxfail=1 tests/test_nexus_080.py tests/test_nexus_cli.py tests/test_nexus_edge_gateway_runtime.py tests/test_nexus_edge_gateway.py tests/test_nexus_edge_manager.py tests/test_nexus_edge_master_integration.py tests/test_nexus_edge_persistence.py tests/test_nexus_edge_replay_guard.py tests/test_nexus_edge_runtime_lock.py tests/test_nexus_edge_runtime.py tests/test_nexus_edge_service.py tests/test_nexus_edge_sqlite_store.py tests/test_nexus_edge_transports.py tests/test_nexus_hardware_benchmark.py tests/test_nexus_runtime.py tests/test_pool_connectors_0104.py tests/test_pool_failover_api.py
            if ($LASTEXITCODE -ne 0) { throw "Windows application test shard 3 of 4 failed." }
          } finally {
            Pop-Location
          }
      - name: Run Windows application test shard 4 of 4
        timeout-minutes: 10
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $env:NEXUS_NATIVE_COMPILER = "msvc"
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings --maxfail=1 tests/test_pool_failover_simulator.py tests/test_pool_fault_simulator.py tests/test_pool_registry_0104.py tests/test_randomx_benchmark_api.py tests/test_randomx_benchmark.py tests/test_runtime_telemetry.py tests/test_sha_avalanche_0102.py tests/test_sha2_research_bridge_0113.py tests/test_sha2_research_service_020.py tests/test_sha256_advanced.py tests/test_sha256_research.py tests/test_solo_bitcoin_rpc_097.py tests/test_solo_mining_096.py tests/test_solo_profiles_0104.py tests/test_stratum_endpoint_tls_0105.py tests/test_stratum_miner_014.py tests/test_stratum_probe_0104.py tests/test_stratum_session_01010.py tests/test_stratum_share_simulator_01012.py tests/test_vault_audit_015.py tests/test_wallet_manager.py tests/test_wallet_recovery_integration_016.py
            if ($LASTEXITCODE -ne 0) { throw "Windows application test shard 4 of 4 failed." }
          } finally {
            Pop-Location
          }
