name: NEXUS CI

on:
  push:
    branches: [main, "feature/**", "integration/**"]
  pull_request:
    branches: [main, "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-detection:
    runs-on: ubuntu-latest
    outputs:
      available: \${{ steps.detect.outputs.available }}
      root: \${{ steps.detect.outputs.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect application source
        id: detect
        shell: bash
        run: |
          if [ -f application/nexus_master.py ] && [ -d application/tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=application" >> "$GITHUB_OUTPUT"
            echo "NEXUS application source found in application/."
          elif [ -f nexus_master.py ] && [ -d tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=." >> "$GITHUB_OUTPUT"
            echo "NEXUS application source found in repository root."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "root=" >> "$GITHUB_OUTPUT"
            echo "::notice::Application source has not been imported yet. Python test jobs will be skipped."
          fi

  python-tests:
    needs: source-detection
    if: needs.source-detection.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          ROOT="\${{ needs.source-detection.outputs.root }}"
          python -m pip install --upgrade pip
          if [ -f "$ROOT/requirements-dev.txt" ]; then
            python -m pip install -r "$ROOT/requirements-dev.txt"
          elif [ -f "$ROOT/requirements.txt" ]; then
            python -m pip install -r "$ROOT/requirements.txt"
            python -m pip install pytest
          else
            echo "::error::No requirements file found in source root: $ROOT"
            exit 1
          fi
      - name: Compile Python sources
        shell: bash
        run: |
          ROOT="\${{ needs.source-detection.outputs.root }}"
          python -m compileall -q "$ROOT"
      - name: Run full test suite
        shell: bash
        run: |
          ROOT="\${{ needs.source-detection.outputs.root }}"
          cd "$ROOT"
          python -m pytest -q --disable-warnings --maxfail=1

  windows-tests:
    needs: source-detection
    if: needs.source-detection.outputs.available == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "\${{ needs.source-detection.outputs.root }}"
          python -m pip install --upgrade pip
          if (Test-Path "$root/requirements-dev.txt") {
            python -m pip install -r "$root/requirements-dev.txt"
          } elseif (Test-Path "$root/requirements.txt") {
            python -m pip install -r "$root/requirements.txt"
            python -m pip install pytest
          } else {
            throw "No requirements file found in source root: $root"
          }
      - name: Compile Python sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "\${{ needs.source-detection.outputs.root }}"
          python -m compileall -q $root
      - name: Run full test suite on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "\${{ needs.source-detection.outputs.root }}"
          Push-Location $root
          try {
            python -m pytest -q --disable-warnings --maxfail=1
          } finally {
            Pop-Location
          }
