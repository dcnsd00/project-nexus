name: NEXUS CI

on:
  push:
    branches: [main, "feature/**", "integration/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect application source root
        id: source
        shell: bash
        run: |
          if [ -f application/nexus_master.py ] && [ -d application/tests ]; then
            echo "root=application" >> "$GITHUB_OUTPUT"
          elif [ -f nexus_master.py ] && [ -d tests ]; then
            echo "root=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::NEXUS application source is not imported. Expected application/nexus_master.py + application/tests/ or root equivalents."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            application/requirements.txt
            application/requirements-dev.txt
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: bash
        run: |
          ROOT="${{ steps.source.outputs.root }}"
          python -m pip install --upgrade pip
          if [ -f "$ROOT/requirements-dev.txt" ]; then
            python -m pip install -r "$ROOT/requirements-dev.txt"
          else
            python -m pip install -r "$ROOT/requirements.txt"
            python -m pip install pytest
          fi

      - name: Compile Python sources
        shell: bash
        run: |
          ROOT="${{ steps.source.outputs.root }}"
          python -m compileall -q "$ROOT"

      - name: Run test suite
        shell: bash
        run: |
          ROOT="${{ steps.source.outputs.root }}"
          cd "$ROOT"
          python -m pytest -q --disable-warnings --maxfail=1
