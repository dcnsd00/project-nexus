name: NEXUS CI

on:
  push:
    branches: [main, "feature/**", "integration/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile NEXUS EDGE
        run: python -m compileall -q nexus_edge tests/test_nexus_edge_manager.py
      - name: Run NEXUS EDGE contract tests
        run: python -m unittest discover -s tests -p 'test_nexus_edge_manager.py' -v

  source-detection:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
      root: ${{ steps.detect.outputs.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect application source
        id: detect
        shell: bash
        run: |
          if [ -f application/nexus_master.py ] && [ -d application/tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=application" >> "$GITHUB_OUTPUT"
            echo "NEXUS application source found in application/."
          elif [ -f nexus_master.py ] && [ -d tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=." >> "$GITHUB_OUTPUT"
            echo "NEXUS application source found in repository root."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "root=" >> "$GITHUB_OUTPUT"
            echo "::notice::Application source has not been imported yet. Python test job will be skipped; documentation commits are not treated as application test failures."
          fi

  python-tests:
    needs: source-detection
    if: needs.source-detection.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          python -m pip install --upgrade pip
          if [ -f "$ROOT/requirements-dev.txt" ]; then
            python -m pip install -r "$ROOT/requirements-dev.txt"
          elif [ -f "$ROOT/requirements.txt" ]; then
            python -m pip install -r "$ROOT/requirements.txt"
            python -m pip install pytest
          else
            echo "::error::No requirements file found in source root: $ROOT"
            exit 1
          fi
      - name: Compile Python sources
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          python -m compileall -q "$ROOT"
      - name: Run test suite
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          cd "$ROOT"
          python -m pytest -q --disable-warnings --maxfail=1
