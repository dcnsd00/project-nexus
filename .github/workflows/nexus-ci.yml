name: NEXUS CI

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feature/**", "integration/**", "experiment/**"]
  pull_request:
    branches: [main, "feature/edge-replay-protection-sqlite-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-detection:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
      root: ${{ steps.detect.outputs.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect application source
        id: detect
        shell: bash
        run: |
          if [ -f application/nexus_master.py ] && [ -d application/tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=application" >> "$GITHUB_OUTPUT"
            echo "NEXUS application source found in application/."
          elif [ -f nexus_master.py ] && [ -d tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "root=." >> "$GITHUB_OUTPUT"
            echo "NEXUS application source found in repository root."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "root=" >> "$GITHUB_OUTPUT"
            echo "::notice::Application source has not been imported yet. Python test job will be skipped; documentation commits are not treated as application test failures."
          fi

  python-tests:
    needs: source-detection
    if: needs.source-detection.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for dashboard validation
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          python -m pip install --upgrade pip
          if [ -f "$ROOT/requirements-dev.txt" ]; then
            python -m pip install -r "$ROOT/requirements-dev.txt"
          elif [ -f "$ROOT/requirements.txt" ]; then
            python -m pip install -r "$ROOT/requirements.txt"
            python -m pip install pytest
          else
            echo "::error::No requirements file found in source root: $ROOT"
            exit 1
          fi
          if [ -f "$ROOT/requirements-edge.txt" ]; then
            python -m pip install -r "$ROOT/requirements-edge.txt"
          fi
      - name: Compile Python sources
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          python -m compileall -q "$ROOT"
      - name: Validate dashboard and wallet JavaScript
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          python "$ROOT/tools_check_dashboard_js.py" "$ROOT"
      - name: Run primary application test suite
        shell: bash
        run: |
          ROOT="${{ needs.source-detection.outputs.root }}"
          cd "$ROOT"
          python -m pytest -vv --full-trace --disable-warnings --maxfail=1
      - name: Run adapter, wallet and independent SHA-2 suites
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ needs.source-detection.outputs.root }}"
          ROOT="$(cd "$ROOT" && pwd)"
          MM="$ROOT/adapters/multiminer_x/MULTIMINER_X_v1.0"
          (cd "$MM" && PYTHONPATH="$ROOT:$MM" python -m pytest -q tests)
          FS="$ROOT/adapters/fieldstation/crypto_fieldstation"
          (cd "$FS" && PYTHONPATH="$ROOT:$FS" python -m pytest -q tests)
          WALLET="$ROOT/modules/wallet_benchmark"
          (cd "$WALLET" && PYTHONPATH="$ROOT:$WALLET" python -m pytest -q tests)
          (cd "$WALLET/v05" && PYTHONPATH="$ROOT:$WALLET:$WALLET/v05" python -m pytest -q test_v05_unit.py)
          RESEARCH="$ROOT/research/sha2_independent"
          (cd "$RESEARCH" && PYTHONPATH="$ROOT:$RESEARCH" python research_main.py test --out-dir "$RUNNER_TEMP/nexus-sha2-results")

  windows-compatibility:
    needs: source-detection
    if: needs.source-detection.outputs.available == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for dashboard validation
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          python -m pip install --upgrade pip
          if (Test-Path (Join-Path $Root "requirements-dev.txt")) {
            python -m pip install -r (Join-Path $Root "requirements-dev.txt")
          } else {
            python -m pip install -r (Join-Path $Root "requirements.txt")
            python -m pip install pytest
          }
          if (Test-Path (Join-Path $Root "requirements-edge.txt")) {
            python -m pip install -r (Join-Path $Root "requirements-edge.txt")
          }
      - name: Configure MSVC x64 build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build native SHA-256d library on Windows
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $NativeBuild = Join-Path $Root "mining/native/build"
          New-Item -ItemType Directory -Force -Path $NativeBuild | Out-Null
          $NativeDll = Join-Path $NativeBuild "nexus_miner.dll"
          $NativeSource = Join-Path $Root "mining/native/miner.c"
          & cl.exe /nologo /O2 /LD /DNEXUS_LIBRARY "/Fe:$NativeDll" "/Fo:$NativeBuild\\" $NativeSource
          if ($LASTEXITCODE -ne 0) { throw "MSVC native SHA-256d build failed." }
          if (-not (Test-Path $NativeDll)) { throw "MSVC did not create nexus_miner.dll." }
          Write-Host "Native SHA-256d library built: $NativeDll"
      - name: Compile Python sources
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          python -m compileall -q $Root
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed." }
      - name: Validate dashboard and wallet JavaScript
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          python (Join-Path $Root "tools_check_dashboard_js.py") $Root
          if ($LASTEXITCODE -ne 0) { throw "Dashboard JavaScript validation failed." }
      - name: Run isolated Windows API test modules
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $Compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Host "Native C compiler: $($Compiler.Source)"
          $env:NEXUS_NATIVE_COMPILER = "msvc"
          $env:NEXUS_NATIVE_MINER_LIB = (Resolve-Path (Join-Path $Root "mining/native/build/nexus_miner.dll")).Path
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings tests/test_mining_solo_matrix_0105.py tests/test_mining_v098.py tests/test_native_sha256d_021.py
            if ($LASTEXITCODE -ne 0) { throw "Isolated Windows mining catalog API modules failed." }
          } finally {
            Pop-Location
          }
      - name: Collect remaining Windows tests into four shards
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $env:NEXUS_NATIVE_COMPILER = "msvc"
          $env:NEXUS_NATIVE_MINER_LIB = (Resolve-Path (Join-Path $Root "mining/native/build/nexus_miner.dll")).Path
          Push-Location $Root
          try {
            $Collected = python -m pytest --collect-only -q --ignore=tests/test_mining_solo_matrix_0105.py --ignore=tests/test_mining_v098.py --ignore=tests/test_native_sha256d_021.py
            if ($LASTEXITCODE -ne 0) { throw "Windows pytest collection failed." }
            $NodeIds = @($Collected | ForEach-Object { "$_".Trim() } | Where-Object { $_ -match '^tests[\\/].+::' })
            if ($NodeIds.Count -eq 0) { throw "No Windows test node IDs were collected." }
            $ShardCount = 4
            $ShardSize = [Math]::Ceiling($NodeIds.Count / $ShardCount)
            for ($i = 0; $i -lt $ShardCount; $i++) {
              $Start = $i * $ShardSize
              $Path = Join-Path $env:RUNNER_TEMP "nexus-windows-shard-$($i + 1).txt"
              if ($Start -lt $NodeIds.Count) {
                $End = [Math]::Min($Start + $ShardSize, $NodeIds.Count)
                @($NodeIds[$Start..($End - 1)]) | Set-Content -Path $Path -Encoding utf8
              } else {
                New-Item -ItemType File -Force -Path $Path | Out-Null
              }
              Write-Host "Windows shard $($i + 1): $([Math]::Min($ShardSize, [Math]::Max(0, $NodeIds.Count - $Start))) tests"
            }
          } finally {
            Pop-Location
          }
      - name: Run Windows test shard 1
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $env:NEXUS_NATIVE_MINER_LIB = (Resolve-Path (Join-Path $Root "mining/native/build/nexus_miner.dll")).Path
          $NodeIds = @(Get-Content (Join-Path $env:RUNNER_TEMP "nexus-windows-shard-1.txt") | Where-Object { $_.Trim() })
          if ($NodeIds.Count -eq 0) { throw "Windows test shard 1 is empty." }
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings --maxfail=1 $NodeIds
            if ($LASTEXITCODE -ne 0) { throw "Windows test shard 1 failed." }
          } finally { Pop-Location }
      - name: Run Windows test shard 2
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $env:NEXUS_NATIVE_MINER_LIB = (Resolve-Path (Join-Path $Root "mining/native/build/nexus_miner.dll")).Path
          $NodeIds = @(Get-Content (Join-Path $env:RUNNER_TEMP "nexus-windows-shard-2.txt") | Where-Object { $_.Trim() })
          if ($NodeIds.Count -eq 0) { throw "Windows test shard 2 is empty." }
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings --maxfail=1 $NodeIds
            if ($LASTEXITCODE -ne 0) { throw "Windows test shard 2 failed." }
          } finally { Pop-Location }
      - name: Run Windows test shard 3
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $env:NEXUS_NATIVE_MINER_LIB = (Resolve-Path (Join-Path $Root "mining/native/build/nexus_miner.dll")).Path
          $NodeIds = @(Get-Content (Join-Path $env:RUNNER_TEMP "nexus-windows-shard-3.txt") | Where-Object { $_.Trim() })
          if ($NodeIds.Count -eq 0) { throw "Windows test shard 3 is empty." }
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings --maxfail=1 $NodeIds
            if ($LASTEXITCODE -ne 0) { throw "Windows test shard 3 failed." }
          } finally { Pop-Location }
      - name: Run Windows test shard 4
        shell: pwsh
        run: |
          $Root = "${{ needs.source-detection.outputs.root }}"
          $env:NEXUS_NATIVE_MINER_LIB = (Resolve-Path (Join-Path $Root "mining/native/build/nexus_miner.dll")).Path
          $NodeIds = @(Get-Content (Join-Path $env:RUNNER_TEMP "nexus-windows-shard-4.txt") | Where-Object { $_.Trim() })
          if ($NodeIds.Count -eq 0) { throw "Windows test shard 4 is empty." }
          Push-Location $Root
          try {
            python -m pytest -vv --full-trace --disable-warnings --maxfail=1 $NodeIds
            if ($LASTEXITCODE -ne 0) { throw "Windows test shard 4 failed." }
          } finally { Pop-Location }



  coraza-waf-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go 1.26.0
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
          cache: false
      - name: Build Coraza-enabled Caddy and validate configuration
        shell: bash
        run: bash deployment/security/coraza/build.sh
