name: NEXUS Windows Desktop Package

on:
  push:
    branches: ["main", "feature/edge-replay-protection-sqlite-v1", "feature/nexus-ai-worker-mining-safety-v1"]
    paths:
      - "application/**"
      - ".github/workflows/nexus-desktop-package.yml"
  pull_request:
    paths:
      - "application/**"
      - ".github/workflows/nexus-desktop-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-frozen-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            application/requirements.txt
            application/requirements-desktop.txt
      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install NEXUS runtime and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }
          python -m pip install -r application/requirements.txt -r application/requirements-edge.txt -r application/requirements-desktop.txt
          if ($LASTEXITCODE -ne 0) { throw "NEXUS core, EDGE and desktop dependencies failed." }
          python -m pip install z3-solver
          if ($LASTEXITCODE -ne 0) { throw "NEXUS Z3 research backend installation failed." }
          python -m pip install pytest pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller dependencies failed." }
      - name: Validate one-click package source
        shell: pwsh
        run: |
          python -m compileall -q application
          if ($LASTEXITCODE -ne 0) { throw "Python compileall failed." }
          python -m pytest -q application/tests/test_desktop_packaging.py
          if ($LASTEXITCODE -ne 0) { throw "Desktop packaging source tests failed." }
          python application/tools_check_dashboard_js.py application
          if ($LASTEXITCODE -ne 0) { throw "Dashboard JavaScript validation failed." }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "application\INSTALL_NEXUS_ONECLICK.ps1"), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ("Installer PowerShell syntax errors: " + ($parseErrors | Out-String)) }
      - name: Build frozen NEXUS desktop executable
        shell: pwsh
        run: |
          Push-Location application
          try {
            python -m PyInstaller --noconfirm --clean packaging\NEXUS_DESKTOP.spec
            if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed." }
          } finally {
            Pop-Location
          }
          $Exe = "application\dist\NEXUS\NEXUS.exe"
          if (-not (Test-Path $Exe)) { throw "Frozen NEXUS.exe missing." }
          if (-not (Test-Path "application\dist\NEXUS\_internal")) { throw "PyInstaller _internal runtime missing." }
      - name: Test the actual frozen executable
        shell: pwsh
        run: |
          $Exe = (Resolve-Path "application\dist\NEXUS\NEXUS.exe").Path
          Write-Host "Running packaged application: $Exe --self-test"
          $p = Start-Process -FilePath $Exe -ArgumentList "--self-test" -WorkingDirectory (Split-Path $Exe) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged NEXUS self-test failed with exit code $($p.ExitCode)." }
          Write-Host "Frozen executable API + dashboard self-test: PASS"
      - name: Remove smoke-test runtime data from distributable
        shell: pwsh
        run: |
          $RuntimeData = "application\dist\NEXUS\data"
          if (Test-Path $RuntimeData) { Remove-Item $RuntimeData -Recurse -Force }
      - name: Assemble one-click ZIP and SHA-256 manifest
        shell: pwsh
        run: |
          $Package = Join-Path $env:RUNNER_TEMP "NEXUS_MASTER_0.10.28_WINDOWS"
          $PackageDist = Join-Path $Package "dist"
          New-Item -ItemType Directory -Force -Path $PackageDist | Out-Null
          Copy-Item "application\dist\NEXUS" (Join-Path $PackageDist "NEXUS") -Recurse -Force
          Copy-Item "application\VERSION.json" (Join-Path $Package "VERSION.json")
          Copy-Item "application\INSTALL_NEXUS.bat" $Package
          Copy-Item "application\INSTALL_NEXUS_ONECLICK.ps1" $Package
          $Readme = @(
            "NEXUS MASTER 0.10.28 — WINDOWS DESKTOP",
            " ",
            "INSTALARE:",
            "1. Despachetează întregul ZIP.",
            "2. Dublu-click pe INSTALL_NEXUS.bat.",
            "3. Instalatorul verifică fișierele, WebView2, instalează NEXUS și rulează testul aplicației.",
            "4. Aplicația pornește automat și creează scurtături pe Desktop și în Start Menu.",
            " ",
            "Windows 10/11 x64. Nu este necesar Python sau Visual Studio.",
            "Internetul este folosit numai dacă lipsește Microsoft WebView2 Runtime.",
            "Instalarea nu pornește mineri, nu conectează pool-uri și nu deblochează wallet-uri.",
            "Cod sursă: https://github.com/dcnsd00/project-nexus"
          )
          $Readme | Set-Content -Path (Join-Path $Package "README_INSTALL_RO.txt") -Encoding UTF8
          $BuildRoot = (Resolve-Path (Join-Path $Package "dist\NEXUS")).Path
          $Files = @(Get-ChildItem $BuildRoot -File -Recurse | ForEach-Object {
            [PSCustomObject]@{
              path = $_.FullName.Substring($BuildRoot.Length + 1).Replace('\','/')
              sha256 = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            }
          })
          $Version = Get-Content (Join-Path $Package "VERSION.json") -Raw | ConvertFrom-Json
          [PSCustomObject]@{
            product = "NEXUS MASTER"
            version = $Version.version
            source_commit = "${{ github.sha }}"
            files = $Files
          } | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $Package "NEXUS_PACKAGE_MANIFEST.json") -Encoding UTF8
          Write-Host "Running complete one-click installer validation on the Windows runner..."
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $Package "INSTALL_NEXUS_ONECLICK.ps1") -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw "End-to-end one-click installer validation failed with exit code $LASTEXITCODE." }
          $InstalledExe = Join-Path $env:LOCALAPPDATA "Programs\NEXUS\NEXUS.exe"
          if (-not (Test-Path $InstalledExe)) { throw "Installer did not place NEXUS.exe in the expected user install directory." }
          $Zip = Join-Path $env:RUNNER_TEMP "NEXUS_MASTER_0.10.28_WINDOWS_INSTALLER.zip"
          Compress-Archive -Path (Join-Path $Package "*") -DestinationPath $Zip -CompressionLevel Optimal -Force
          Get-Item $Zip | Select-Object FullName,Length | Format-List
          "NEXUS_PACKAGE_ZIP=$Zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload one-click Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NEXUS_MASTER_0.10.28_WINDOWS_INSTALLER
          path: ${{ env.NEXUS_PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 30
