name: Gate Info and Paper Trading Tests

on:
  pull_request:
    paths:
      - "application/modules/gate_paper_trading.py"
      - "application/tests/test_gate_paper_trading.py"
      - "application/nexus_master.py"
      - "application/modules/module_registry.py"
      - "application/dashboard.html"
      - ".github/workflows/gate-paper-trading.yml"

jobs:
  gate-paper-trading:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/requirements.txt
      - name: Install focused test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2.8,<3" "httpx>=0.27,<1" "pytest>=9.0.3,<10"
      - name: Run Gate integration tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_gate_paper_trading.py
