name: NEXUS Public Market Data Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-market-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and test dependencies
        working-directory: application
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Run public GET-only smoke checks
        working-directory: application
        env:
          NEXUS_RUN_LIVE_MARKET_SMOKE: "1"
        run: |
          python -m pytest -q tests/test_market_data_live_smoke.py
